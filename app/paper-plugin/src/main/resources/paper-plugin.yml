name: PCBridge
website: https://github.com/projectcitybuild/PCBridge
version: 6.10.0
api-version: 1.21.10
main: com.projectcitybuild.pcbridge.app.paperplugin.Plugin
bootstrapper: com.projectcitybuild.pcbridge.app.paperplugin.PaperBootstrap
loader: com.projectcitybuild.pcbridge.app.paperplugin.PaperLoader

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
    dynmap:
      load: BEFORE
      required: false
      join-classpath: true
    Essentials:
      load: BEFORE
      required: false
      join-classpath: true